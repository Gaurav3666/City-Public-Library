
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librarian Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-top">
        <a class="brand" href="index.html">▤ City Public Library</a>
    </div>

    <main class="auth-wrap">
        <div class="auth-brand">
            <h1>Staff Portal</h1>
            <p class="muted">Library operations access.</p>
        </div>

        <section class="auth-card">
            <h2>Librarian Login</h2>
            <p class="subtext">Sign in to manage library operations.</p>

            <form id="login-form">
                <div class="field">
                    <label for="email">Staff email</label>
                    <input id="email" type="email" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" required>
                </div>

                <div id="message" class="message"></div>
                <button id="submit" class="btn primary full">Login</button>
            </form>

            <a class="back" href="index.html">Back to catalogue</a>
        </section>
    </main>

    <script src="auth.js"></script>
    <script>
        document.getElementById("login-form").addEventListener("submit", async event => {
            event.preventDefault();

            const button = document.getElementById("submit");
            const message = document.getElementById("message");
            button.disabled = true;

            try {
                await apiRequest("/members/staff/login", {
                    method: "POST",
                    body: JSON.stringify({
                        email: document.getElementById("email").value.trim(),
                        password: document.getElementById("password").value
                    })
                });

                location.href = "librarian_dashboard.html";
            } catch (error) {
                showMessage(message, error.message);
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
